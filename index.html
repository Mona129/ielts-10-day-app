<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0ea5e9"><meta name="description" content="雅思十天冲刺打卡 App"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="雅思冲刺"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="css/style.css"><title>雅思十天冲刺</title>
</head>
<body>
<header class="top"><div><div class="brand">雅思<span>十天冲刺</span></div><div id="daySub" class="muted"></div></div><div class="ring"><b id="totalPct">0%</b></div></header>
<main>
<section class="hero"><div><div id="dateTitle" class="date-title"></div><div id="modeText" class="muted"></div></div><button id="notifyBtn" class="ghost">🔔 提醒</button></section>
<section class="stats"><div><b id="dayDone">0</b><span>今日完成</span></div><div><b id="dayTotal">0</b><span>今日任务</span></div><div><b id="dayRate">0%</b><span>今日进度</span></div></section>
<div class="bar"><i id="dayBar"></i></div>
<nav class="tabs"><button class="active" data-tab="today">今天</button><button data-tab="stats">十天统计</button><button data-tab="plan">计划</button></nav>
<section id="todayView"><div id="tasks"></div></section>
<section id="statsView" hidden><div id="statCards" class="stat-grid"></div><div class="panel"><h2>十天总进度</h2><div id="overallBars"></div></div></section>
<section id="planView" hidden><div class="panel"><h2>轻松模式</h2><p>8/12、8/13 减少高耗能任务；被挪走的内容集中到周六、周日。你可以随时把任务顺延到周末。</p><div class="actions"><button id="weekendBtn">查看周末</button><button id="installBtn">添加到主屏幕</button></div></div><div id="datePicker" class="date-grid"></div></section>
</main>
<div id="toast" class="toast"></div>
<div id="reminderModal" class="modal" hidden><div class="modal-box"><h2>设置提醒</h2><p id="reminderLabel" class="muted"></p><div class="reminder-grid"><button data-min="0">开始时</button><button data-min="5">提前 5 分钟</button><button data-min="10">提前 10 分钟</button><button data-min="15">提前 15 分钟</button><button data-min="30">提前 30 分钟</button></div><input id="customTime" type="time"><div class="actions"><button id="saveReminder">保存</button><button id="clearReminder" class="danger">清除</button><button id="closeReminder">取消</button></div></div></div>
<script src="js/tasks.js"></script><script src="js/storage.js"></script><script src="js/notifications.js"></script><script src="js/app.js"></script>
</body></html>
