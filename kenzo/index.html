<body>
<div id="root">
<section id="entry" class="entry"><div class="entryInner"><div class="logo">KENZO</div><div class="micro">SOCIAL WORLDS · INTERACTIVE SHOWCASE</div><div class="hello">Hi! Let’s play with KENZO’s new social worlds.</div><div class="desc" id="entryDesc"></div>
<div id="langStep" class="step"><div class="label">LANGUAGE</div><div class="grid2"><button id="cnBtn" class="choice on" onclick="setLang('cn')"><b>简体中文</b><small>Mainland China</small></button><button id="twBtn" class="choice" onclick="setLang('tw')"><b>繁體中文</b><small>Taiwan style</small></button></div><button class="primary" onclick="showWorldStep()" id="nextLabel">下一步</button></div>
<div id="worldStep" class="step hidden"><div class="label" id="worldLabel">CHOOSE YOUR WORLD</div><div class="grid2"><button id="xhsBtn" class="choice on" onclick="setWorld('xhs')"><b id="xhsName">小红书世界</b><small id="xhsHint"></small></button><button id="dyBtn" class="choice" onclick="setWorld('dy')"><b>抖音世界</b><small id="dyHint"></small></button></div><button class="primary" onclick="enterApp()" id="enterLabel">进入体验</button><button class="secondary" onclick="showLangStep()" id="backLabel">返回上一步</button></div>
</div></section>
<section id="app" class="app"><div class="device"><div id="scroll" class="scroll"><div id="content"></div></div><div class="present"><button onclick="prevChapter()" id="prevLabel">上一章</button><div class="progress" id="progress"></div><button class="next" onclick="nextChapter()" id="nextChapterLabel">下一章</button></div>
<div id="guide" class="sheetWrap"><div class="overlay" onclick="closeGuide()"></div><div class="sheet"><div class="grab"></div><div class="shead"><div><h3 id="guideTitle">导览</h3><div class="sheetCopy" id="guideDesc"></div></div><button onclick="closeGuide()">×</button></div><div class="glist" id="glist"></div><div class="switches"><button onclick="toggleLang()" id="toggleLangBtn"></button><button onclick="toggleWorld()" id="toggleWorldBtn"></button></div></div></div>
<div id="detail" class="sheetWrap"><div class="overlay" onclick="closeDetail()"></div><div class="sheet"><div class="grab"></div><div class="shead"><h3 id="detailTitle"></h3><button onclick="closeDetail()">×</button></div><div id="detailBody" class="detailBody"></div></div></div>
</div></section>
</div>
<script>
const COPY={cn:{desc:'这不是一份普通汇报，而是一次进入 KENZO 新社媒世界的体验。',next:'下一步',enter:'进入体验',back:'返回上一步',xhs:'小红书世界',xhint:'图文 / Live 图 / 收藏感',dhint:'视频 / 变化 / 停留感',guide:'导览',gdesc:'点哪个就进入哪个板块，汇报时可以完全按你的节奏来。',switchLang:'切换繁中',switchX:'切换小红书世界',switchD:'切换抖音世界',prev:'上一章',nextCh:'下一章',nav:['创建账号目标','目标人群','账号定位','内容','工作流程','数据复盘','需要支持'],goal:{title:'先把账号做成会被记住、也会被喜欢的新社媒入口。',lead:'两个新账号不会只是新品通知或产品图搬运。先让内容本身值得看，再让用户在看的过程中发现：哦，原来这是 KENZO。',quote:'围绕产品，创意地玩。',items:[['创建账号的核心目的','让 KENZO 在中国社媒里多一个更轻、更有记忆点的入口。内容先把人吸引进来，产品和品牌气质再把人留下。'],['两个平台怎么配合','同一件产品、同一个主题、同一个核心创意。小红书负责展开，抖音负责变化。'],['长期想留下的印象','同样是一件衣服，KENZO 总能找到一个不太普通的打开方式。']]},audience:{title:'重点不是泛泛拉新，而是把该吸引的人和该维稳的人分清楚。',lead:'新账号要有新鲜感，但不能因为好玩就丢掉 KENZO 本来的品牌感。',items:[['重点拉新','25–35 岁左右，对穿搭、生活方式和品牌气质有感知，但目前还没有真正把 KENZO 看成“我的牌子”的人。'],['维稳','已经认识 KENZO、具备消费基础的成熟用户。创意可以新，但产品信息、质感和品牌判断必须站得住。'],['自然扩圈','更年轻的用户可以先成为观看者和分享者。短期先记住内容，长期再慢慢靠近品牌。']]},position:{title:'三个方向都围绕真实产品，只是玩的地方不一样。',lead:'目前优先推进“顺着细节跑偏”。另外两个方向保留，后续根据具体产品穿插使用。',dirs:[{name:'顺着细节跑偏',main:true,tag:'玩的是：从哪里开始',desc:'从一个真实存在的颜色、线条、刺绣、口袋、版型或材质开始，顺着这个点继续往外发展。',persona:'像一个特别容易被服装细节勾住的人。好奇、有点鬼灵精怪，但不会为了有趣硬加和产品无关的东西。',xhs:'完整 Look → 局部细节 → 视觉线索延伸 → 回到完整产品。',dy:'让真实细节变成小机关：拉线、拖颜色、开口袋、拖徽章、抽卡牌。'},{name:'换个方式出场',main:false,tag:'玩的是：怎么出现',desc:'重新设计产品被看到的顺序。可以先出现颜色、局部、背影、轮廓或动作，再一点点走到完整 Look。',persona:'很会安排服装怎么登场。克制一点，但会让人想再看一下。',xhs:'通过翻页控制产品信息出现的顺序。',dy:'用一个明确动作触发出场：靠近、划过、遮挡、翻页、拉远。'},{name:'衣服换个说法',main:false,tag:'玩的是：最后变成什么',desc:'把产品翻译成另一种熟悉但意外的视觉语言，比如 Receipt、花束、卡牌、档案、清单。',persona:'很会给衣服换语言的人。脑洞更大，但最后要说得通。',xhs:'先看到一个有意思的形式，再慢慢发现里面其实全是 KENZO 产品。',dy:'让转换过程真的发生：扫描、打印、包装、抽卡、重组。'}]},content:{title:'先用 3 个案例证明这套内容方式真的能做出来。',lead:'案例不是为了做一张漂亮效果图，而是让领导直接看到：同一套产品可以如何变成小红书笔记、Live 图和抖音动态。',tabs:['3 个案例','图文参考','视频参考']},workflow:{title:'一个核心选题，一次准备 / 拍摄，一套素材，再做两个平台版本。',lead:'工作流的前提是一个人也能长期执行，不用为了两个平台重复拍两套内容。',tabs:['第一周','每周工作','前三个月','长期目标'],week1:[['DAY 01','完成账号注册、认证、头像、简介和基础视觉；最终确认主方向与双平台表达。'],['DAY 02','从实际产品里确定第一批 3–4 个核心选题。'],['DAY 03','集中拍摄完整 Look、正侧背、上半身、产品细节、材质、干净底图和简单动态素材。'],['DAY 04','同一套素材完成小红书图文和抖音动态版本。'],['DAY 05','首批内容上线，建立数据记录表，第一次完整制作流程跑通。']],weekly:[['周一','复盘上一周数据，确定本周约 3 个核心选题。'],['周二','确定 Look、产品、道具、Shot List。'],['周三','集中拍摄 2–3 个核心选题需要的静态和动态素材。'],['周四','集中完成小红书排版 / 文案 / 封面，以及抖音剪辑 / 动态 / 第一帧。'],['周五','补素材、整理数据，记录哪些形式值得继续。']],months:[['MONTH 01 · TEST','测试产品、细节、打开方式、视觉形式和制作量，建立账号 Baseline。'],['MONTH 02 · REPEAT','70% 重复正反馈方向，30% 留给新测试。'],['MONTH 03 · STABILIZE','把表现稳定的方式留下，形成 3–5 个可持续系列。']],long:'长期先让内容方式成立，再自然承载新品、重点单品、Campaign、门店、活动、电商节点和品牌故事。'},data:{title:'数据复盘不是只看热不热，而是判断哪种表达方式值得继续做。',xhs:'小红书：曝光 → 打开 → 收藏 / 分享 → 主页 → 关注。重点看打开、收藏、主页访问和关注。',dy:'抖音：3 秒 → 5 秒 → 平均观看 / 完播 → 主页 → 关注。重点看开场、变化发生位置、观看时长和主页访问。',items:[['KEEP','同一种方式换不同产品做 2–3 次，依然明显高于账号 Baseline，而且制作量可控。'],['TEST AGAIN','有好信号但不稳定，再测一次，而且一次只改一个变量。'],['PAUSE','连续多次低于 Baseline，而且制作时间很长，先暂停。'],['评论也要看','“创意好有意思”说明形式成立；“这件 KENZO 竟然挺好看”更重要，说明注意力回到了产品。'],['效果 × 制作时间','最终留下的方向必须既有效，又能长期做。']]},support:{title:'需要的支持尽量简单，但要让账号真正能跑起来。',lead:'产品素材稳定、拍摄工具够用、AI 制作和基础投流能够配合，就可以先跑起来。',items:[['产品及素材','重点产品、可借拍样衣，以及高清产品图、Lookbook、Campaign 等基础素材提前同步。'],['拍摄支持','手机 / 相机、三脚架、补光灯、手持稳定器，以及必要的小型拍摄道具。'],['制作工具','即梦高级会员作为主要 AI 视觉工具，配合基础剪辑 / 排版软件。'],['内容加热','小红书薯条和抖音 DOU+ 先小额测试，表现好的内容再追加。'],['审核配合','重点产品、发布时间和必须准确的信息尽量提前确认。']],budget:[['小红书薯条','约 1,500 / 月','约 4,500 / 季度'],['抖音 DOU+','约 2,000 / 月','约 6,000 / 季度'],['即梦高级会员','首月 599 / 后续 998','首季度 2,595'],['基础预计使用','—','13,095'],['首季度预算上限','—','约 15,000']],note:'约 1.31 万基础预算 + 约 0.19 万机动空间。'}},tw:null};
COPY.tw=JSON.parse(JSON.stringify(COPY.cn));COPY.tw.desc='這不是一份普通簡報，而是一次進入 KENZO 新社群世界的體驗。';COPY.tw.enter='開始體驗';COPY.tw.back='返回上一步';COPY.tw.xhs='小紅書世界';COPY.tw.xhint='圖文 / Live 圖 / 收藏感';COPY.tw.dhint='影片 / 變化 / 停留感';COPY.tw.guide='導覽';COPY.tw.gdesc='點哪個就進入哪個板塊，簡報時可以完全照你的節奏來。';COPY.tw.switchLang='切換簡中';COPY.tw.switchX='切換小紅書世界';COPY.tw.switchD='切換抖音世界';COPY.tw.nav=['建立帳號目標','目標人群','帳號定位','內容','工作流程','數據回顧','需要支持'];COPY.tw.goal.title='先把帳號做成會被記住、也會被喜歡的新社群入口。';COPY.tw.goal.lead='兩個新帳號不會只是新品通知或產品圖搬運。先讓內容本身值得看，再讓使用者在看的過程中發現：喔，原來這是 KENZO。';COPY.tw.goal.quote='圍繞產品，創意地玩。';COPY.tw.position.title='三個方向都圍繞真實產品，只是玩的地方不一樣。';COPY.tw.content.title='先用 3 個案例證明這套內容方式真的能做出來。';COPY.tw.workflow.title='一個核心選題，一次準備 / 拍攝，一套素材，再做兩個平台版本。';COPY.tw.data.title='數據回顧不是只看熱不熱，而是判斷哪種表達方式值得繼續做。';
const S={lang:'cn',world:'xhs',chapter:0,ctab:0,wtab:0};const K=['goal','audience','position','content','workflow','data','support'];const $=s=>document.querySelector(s);const C=()=>COPY[S.lang];const N=()=>C().nav;const CH=()=>C()[K[S.chapter]];const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function setLang(v){S.lang=v;$('#cnBtn').classList.toggle('on',v==='cn');$('#twBtn').classList.toggle('on',v==='tw');updateEntry()}function setWorld(v){S.world=v;$('#xhsBtn').classList.toggle('on',v==='xhs');$('#dyBtn').classList.toggle('on',v==='dy')}function showWorldStep(){$('#langStep').classList.add('hidden');$('#worldStep').classList.remove('hidden')}function showLangStep(){$('#worldStep').classList.add('hidden');$('#langStep').classList.remove('hidden')}function enterApp(){$('#entry').classList.add('hidden');render()}function resetApp(){$('#app').classList.remove('on','dy','xhs');$('#entry').classList.remove('hidden');showLangStep();S.chapter=0;S.ctab=0;S.wtab=0;updateEntry()}function toggleLang(){S.lang=S.lang==='cn'?'tw':'cn';updateEntry();render()}function toggleWorld(){S.world=S.world==='xhs'?'dy':'xhs';closeGuide();render()}function prevChapter(){if(S.chapter>0){S.chapter--;render()}}function nextChapter(){if(S.chapter<6){S.chapter++;render()}}function goChapter(i){S.chapter=Number(i);closeGuide();render()}function openGuide(){$('#guide').classList.add('show')}function closeGuide(){$('#guide').classList.remove('show')}function openDetail(title,html){$('#detailTitle').textContent=title;$('#detailBody').innerHTML=html;$('#detail').classList.add('show')}function closeDetail(){$('#detail').classList.remove('show')}function setContentTab(i){S.ctab=Number(i);render()}function setWorkflowTab(i){S.wtab=Number(i);render()}function updateEntry(){let c=C();$('#entryDesc').textContent=c.desc;$('#nextLabel').textContent=c.next;$('#enterLabel').textContent=c.enter;$('#backLabel').textContent=c.back;$('#xhsName').textContent=c.xhs;$('#xhsHint').textContent=c.xhint;$('#dyHint').textContent=c.dhint}
function topX(){return `<div class="xhead"><div class="status"><span>17:44</span><span>●●● ▰</span></div><div class="profile"><button class="back" onclick="resetApp()">‹</button><div class="avatar">K</div><div class="name">KENZO China</div><button class="follow">Follow</button><div class="share">↗</div></div><div class="strip"><button class="pill menu" onclick="openGuide()">☰</button>${N().map((n,i)=>`<button class="pill ${i===S.chapter?'on':''}" onclick="goChapter(${i})">${String(i+1).padStart(2,'0')} ${esc(n)}</button>`).join('')}</div></div>`}function topD(){return `<div class="dyTop"><div class="status"><span>17:44</span><span>●●● ▰</span></div><div class="dyLine"><button onclick="resetApp()">‹</button><span>KENZO China</span><button onclick="openGuide()">☰</button></div><div class="dyTabs"><span>首页</span><span>关注</span><b>推荐</b><span>商城</span></div><div class="strip">${N().map((n,i)=>`<button class="pill ${i===S.chapter?'on':''}" onclick="goChapter(${i})">${esc(n)}</button>`).join('')}</div></div>`}
function rows(a){return a.map(x=>`<div class="row"><b>${esc(x[0])}</b><p>${esc(x[1])}</p></div>`).join('')}function dirs(){return CH().dirs.map((x,i)=>`<div class="dir"><small>0${i+1}${x.main?'<span class="badge">MAIN</span>':''}</small><h3>${esc(x.name)}</h3><p><b>${esc(x.tag)}</b><br><br>${esc(x.desc)}<br><br>${esc(x.persona)}</p><div class="split"><div><b>小红书</b><p>${esc(x.xhs)}</p></div><div><b>抖音</b><p>${esc(x.dy)}</p></div></div></div>`).join('')}
function contentBlock(){let d=CH(),h=`<div class="sec"><div class="secLabel">CREATIVE CONTENT</div><div class="tabs">${d.tabs.map((t,i)=>`<button class="tab ${i===S.ctab?'on':''}" onclick="setContentTab(${i})">${esc(t)}</button>`).join('')}</div>`;if(S.ctab===0){h+=`<div class="rail"><button class="case" onclick="openDetail('LOOK RECEIPT','<div class=&quot;row&quot;><p>发票从上到下打印出来的 Live 图 / 动态案例。正式版这里接入已经做好的 Receipt 动图。</p></div>')"><div class="caseArt receipt"></div><div class="caseText"><b>LOOK RECEIPT · ${S.lang==='cn'?'发票':'發票'}</b><p>${S.lang==='cn'?'衣服换个说法':'衣服換個說法'}</p></div></button><button class="case" onclick="openDetail('PRODUCT COLLAGE','<div class=&quot;row&quot;><p>每个产品细节依次出现，最后回到完整单品。</p></div>')"><div class="caseArt collage"></div><div class="caseText"><b>PRODUCT COLLAGE · ${S.lang==='cn'?'拼贴':'拼貼'}</b><p>${S.lang==='cn'?'顺着细节跑偏':'順著細節跑偏'}</p></div></button><button class="case" onclick="openDetail('KENZO BOUQUET','<div class=&quot;row&quot;><p>几件衣服逐步被包装成花束的动态过程。</p></div>')"><div class="caseArt bouquet"></div><div class="caseText"><b>KENZO BOUQUET · ${S.lang==='cn'?'包装成鲜花':'包裝成鮮花'}</b><p>${S.lang==='cn'?'衣服换个说法':'衣服換個說法'}</p></div></button></div>`}else{let names=S.ctab===1?['ROMI STUDIO Bouquet','Paper Cutout','Outfit Receipt']:['Live Motion','Label Check','Scale Shift','Grid Game','Word Drag'];h+=`<div class="refs">${names.map(x=>`<button class="ref" onclick="openDetail('${x}','<div class=&quot;row&quot;><p>${S.lang==='cn'?'这里会接入你给我的原图 / 原视频参考，并保留直接播放和查看。':'這裡會接入你提供的原圖 / 原影片參考，並保留直接播放和查看。'}</p></div>')"><div class="refArt">${esc(x)}</div><b>${esc(x)}</b></button>`).join('')}</div>`}return h+'</div>'}function workflowBlock(){let d=CH(),arr=S.wtab===0?d.week1:S.wtab===1?d.weekly:S.wtab===2?d.months:null;return `<div class="sec"><div class="secLabel">WORKFLOW</div><div class="tabs">${d.tabs.map((t,i)=>`<button class="tab ${i===S.wtab?'on':''}" onclick="setWorkflowTab(${i})">${esc(t)}</button>`).join('')}</div>${arr?rows(arr):`<div class="quote" style="margin-top:12px">${esc(d.long)}</div>`}</div>`}function budget(){let d=CH();return `<div class="sec"><div class="secLabel">Q1 BUDGET</div><div class="table">${d.budget.map(r=>`<div class="tr">${r.map(c=>`<div>${esc(c)}</div>`).join('')}</div>`).join('')}</div><div class="row"><p>${esc(d.note)}</p></div></div>`}function details(){if(S.chapter===0)return `<div class="sec">${rows(CH().items)}<div class="quote">“${esc(CH().quote)}”</div></div>`;if(S.chapter===1)return `<div class="sec">${rows(CH().items)}</div>`;if(S.chapter===2)return `<div class="sec">${dirs()}</div>`;if(S.chapter===3)return contentBlock();if(S.chapter===4)return workflowBlock();if(S.chapter===5)return `<div class="sec">${rows(CH().items)}</div>`;return `<div class="sec">${rows(CH().items)}</div>${budget()}`}
function xhsPage(){let d=CH(),lead=S.chapter===5?d.xhs:d.lead;return `<div class="noteArt"><div class="artCore"></div><div class="shade"></div><div class="coverTxt"><small>KENZO SOCIAL WORLDS · ${String(S.chapter+1).padStart(2,'0')}</small><h1>${esc(d.title)}</h1></div></div><div class="dots"><i class="on"></i><i></i><i></i></div><div class="body"><h2>${esc(d.title)}</h2>${lead?`<div class="lead">${esc(lead)}</div>`:''}<div class="tags">#KENZO #SocialWorlds #${esc(N()[S.chapter])}</div>${details()}</div><div class="actions"><div class="comment">Say something…</div><div class="act"><span>♡</span>1,208</div><div class="act"><span>☆</span>256</div><div class="act"><span>◌</span>28</div></div>`}function dyPage(){let d=CH(),lead=S.chapter===5?d.dy:d.lead;return `<div class="reel"><div class="dmedia"></div><div class="dshade"></div><div class="side"><div class="bubble">♥</div><small>2.1w</small><div class="bubble">◌</div><small>1,236</small><div class="bubble">☆</div><small>569</small><div class="bubble">↗</div><small>share</small></div><div class="dtext"><b>@ KENZO China</b><h2>${esc(d.title)}</h2><p>${esc(lead||'')}</p><button class="more" onclick="openDetail(N()[S.chapter],details())">查看方案</button></div></div>`}function renderGuide(){let c=C();$('#guideTitle').textContent=c.guide;$('#guideDesc').textContent=c.gdesc;$('#glist').innerHTML=N().map((n,i)=>`<button class="gitem ${i===S.chapter?'on':''}" onclick="goChapter(${i})"><small>${String(i+1).padStart(2,'0')}</small><b>${esc(n)}</b></button>`).join('');$('#toggleLangBtn').textContent=c.switchLang;$('#toggleWorldBtn').textContent=S.world==='xhs'?c.switchD:c.switchX}function render(){let app=$('#app');app.className='app on '+(S.world==='dy'?'dy':'xhs');$('#content').innerHTML=(S.world==='xhs'?topX():topD())+(S.world==='xhs'?xhsPage():dyPage());$('#progress').textContent=`${String(S.chapter+1).padStart(2,'0')} / 07`;$('#prevLabel').textContent=C().prev;$('#nextChapterLabel').textContent=C().nextCh;$('#scroll').scrollTop=0;renderGuide()}updateEntry();
</script>
