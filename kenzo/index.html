:#999}.gitem b{font-size:13px}.gitem.on{background:#111;color:#fff;border-color:#111}.detailBody{margin-top:8px}@media(min-width:700px){.app{padding:14px 0}.device{border-radius:32px;box-shadow:0 20px 70px #0008}}</style></head><body><div id="entry" class="entry"><div class="ebox"><div class="logo">KENZO</div><div class="meta">SOCIAL WORLDS · INTERACTIVE SHOWCASE</div><div class="hello">Hi! Let’s play with KENZO’s new social worlds.</div><div class="sub">一份可以像刷社媒一样体验的 KENZO 新账号 0–1 汇报。</div><div id="langstep" class="step"><div class="lab">LANGUAGE</div><div class="grid"><button class="choice on" data-a="lang" data-v="cn"><b>简体中文</b><small>Mainland China</small></button><button class="choice" data-a="lang" data-v="tw"><b>繁體中文</b><small>Taiwan style</small></button></div><button class="primary" data-a="nextstep">下一步</button></div><div id="worldstep" class="step hide"><div class="lab">CHOOSE YOUR WORLD</div><div class="grid"><button class="choice on" data-a="world" data-v="xhs"><b>小红书世界</b><small>图文 / Live 图 / 收藏感</small></button><button class="choice" data-a="world" data-v="dy"><b>抖音世界</b><small>视频 / 变化 / 停留感</small></button></div><button class="primary" data-a="enter">进入体验</button><button class="secondary" data-a="backstep">返回上一步</button></div></div></div><section id="app" class="app"><div class="device"><div id="scroll" class="scroll"><div id="content"></div></div><div class="present"><button data-a="prev">上一章</button><div id="progress" class="progress"></div><button class="next" data-a="next">下一章</button></div><div id="guide" class="sheetWrap"><div class="overlay" data-a="closeguide"></div><div class="sheet"><div class="grab"></div><div class="shead"><h3>导览</h3><button data-a="closeguide">×</button></div><div id="glist" class="glist"></div></div></div><div id="detail" class="sheetWrap"><div class="overlay" data-a="closedetail"></div><div class="sheet"><div class="grab"></div><div class="shead"><h3 id="dtitle"></h3><button data-a="closedetail">×</button></div><div id="dbody" class="detailBody"></div></div></div></div></section><script>const DATA={cn:{nav:['创建账号目标','目标人群','账号定位','内容','工作流程','数据复盘','需要支持'],goal:{title:'先把账号做成会被记住、也会被喜欢的新社媒入口。',lead:'两个新账号不会只是新品通知或产品图搬运。先让内容本身值得看，再让用户在看的过程中发现：哦，原来这是 KENZO。',quote:'围绕产品，创意地玩。',items:[['创建账号的核心目的','让 KENZO 在中国社媒里多一个更轻、更有记忆点的入口。内容先把人吸引进来，产品和品牌气质再把人留下。'],['两个平台怎么配合','同一件产品、同一个主题、同一个核心创意。小红书负责展开，抖音负责变化。'],['长期想留下的印象','同样是一件衣服，KENZO 总能找到一个不太普通的打开方式。']]},audience:{title:'重点不是泛泛拉新，而是把该吸引的人和该维稳的人分清楚。',lead:'新账号要有新鲜感，但不能因为好玩就丢掉 KENZO 本来的品牌感。',items:[['重点拉新','25–35 岁左右，对穿搭、生活方式和品牌气质有感知，但目前还没有真正把 KENZO 看成“我的牌子”的人。'],['维稳','已经认识 KENZO、具备消费基础的成熟用户。创意可以新，但产品信息、质感和品牌判断必须站得住。'],['自然扩圈','更年轻的用户可以先成为观看者和分享者。短期先记住内容，长期再慢慢靠近品牌。']]},position:{title:'三个方向都围绕真实产品，只是玩的地方不一样。',lead:'目前优先推进“顺着细节跑偏”。另外两个方向保留，后续根据具体产品穿插使用。',dirs:[{name:'顺着细节跑偏',main:true,tag:'玩的是：从哪里开始',desc:'从一个真实存在的颜色、线条、刺绣、口袋、版型或材质开始，顺着这个点继续往外发展。',persona:'像一个特别容易被服装细节勾住的人。好奇、有点鬼灵精怪，但不会为了有趣硬加和产品无关的东西。',xhs:'完整 Look → 局部细节 → 视觉线索延伸 → 回到完整产品。',dy:'让真实细节变成小机关：拉线、拖颜色、开口袋、拖徽章、抽卡牌。'},{name:'换个方式出场',main:false,tag:'玩的是：怎么出现',desc:'重新设计产品被看到的顺序。可以先出现颜色、局部、背影、轮廓或动作，再一点点走到完整 Look。',persona:'很会安排服装怎么登场。克制一点，但会让人想再看一下。',xhs:'通过翻页控制产品信息出现的顺序。',dy:'用一个明确动作触发出场：靠近、划过、遮挡、翻页、拉远。'},{name:'衣服换个说法',main:false,tag:'玩的是：最后变成什么',desc:'把产品翻译成另一种熟悉但意外的视觉语言，比如 Receipt、花束、卡牌、档案、清单。',persona:'很会给衣服换语言的人。脑洞更大，但最后要说得通。',xhs:'先看到一个有意思的形式，再慢慢发现里面其实全是 KENZO 产品。',dy:'让转换过程真的发生：扫描、打印、包装、抽卡、重组。'}]},content:{title:'先用 3 个案例证明这套内容方式真的能做出来。',lead:'案例不是为了做一张漂亮效果图，而是让领导直接看到：同一套产品可以如何变成小红书笔记、Live 图和抖音动态。',tabs:['3 个案例','图文参考','视频参考']},workflow:{title:'一个核心选题，一次准备 / 拍摄，一套素材，再做两个平台版本。',lead:'工作流的前提是一个人也能长期执行，不用为了两个平台重复拍两套内容。',tabs:['第一周','每周工作','前三个月','长期目标'],week1:[['DAY 01','完成账号注册、认证、头像、简介和基础视觉；最终确认主方向与双平台表达。'],['DAY 02','从实际产品里确定第一批 3–4 个核心选题。'],['DAY 03','集中拍摄完整 Look、正侧背、上半身、产品细节、材质、干净底图和简单动态素材。'],['DAY 04','同一套素材完成小红书图文和抖音动态版本。'],['DAY 05','首批内容上线，建立数据记录表，第一次完整制作流程跑通。']],weekly:[['周一','复盘上一周数据，确定本周约 3 个核心选题。'],['周二','确定 Look、产品、道具、Shot List。'],['周三','集中拍摄 2–3 个核心选题需要的静态和动态素材。'],['周四','集中完成小红书排版 / 文案 / 封面，以及抖音剪辑 / 动态 / 第一帧。'],['周五','补素材、整理数据，记录哪些形式值得继续。']],months:[['MONTH 01 · TEST','测试产品、细节、打开方式、视觉形式和制作量，建立账号 Baseline。'],['MONTH 02 · REPEAT','70% 重复正反馈方向，30% 留给新测试。'],['MONTH 03 · STABILIZE','把表现稳定的方式留下，形成 3–5 个可持续系列。']],long:'长期先让内容方式成立，再自然承载新品、重点单品、Campaign、门店、活动、电商节点和品牌故事。'},data:{title:'数据复盘不是只看热不热，而是判断哪种表达方式值得继续做。',xhs:'小红书：曝光 → 打开 → 收藏 / 分享 → 主页 → 关注。重点看打开、收藏、主页访问和关注。',dy:'抖音：3 秒 → 5 秒 → 平均观看 / 完播 → 主页 → 关注。重点看开场、变化发生位置、观看时长和主页访问。',items:[['KEEP','同一种方式换不同产品做 2–3 次，依然明显高于账号 Baseline，而且制作量可控。'],['TEST AGAIN','有好信号但不稳定，再测一次，而且一次只改一个变量。'],['PAUSE','连续多次低于 Baseline，而且制作时间很长，先暂停。'],['评论也要看','“创意好有意思”说明形式成立；“这件 KENZO 竟然挺好看”更重要，说明注意力回到了产品。'],['效果 × 制作时间','最终留下的方向必须既有效，又能长期做。']]},support:{title:'需要的支持尽量简单，但要让账号真正能跑起来。',items:[['产品及素材','重点产品、可借拍样衣，以及高清产品图、Lookbook、Campaign 等基础素材提前同步。'],['拍摄支持','手机 / 相机、三脚架、补光灯、手持稳定器，以及必要的小型拍摄道具。'],['制作工具','即梦高级会员作为主要 AI 视觉工具，配合基础剪辑 / 排版软件。'],['内容加热','小红书薯条和抖音 DOU+ 先小额测试，表现好的内容再追加。'],['审核配合','重点产品、发布时间和必须准确的信息尽量提前确认。']],budget:[['小红书薯条','约 1,500 元 / 月','约 4,500 元 / 季度'],['抖音 DOU+','约 2,000 元 / 月','约 6,000 元 / 季度'],['即梦高级会员','首月 599 / 后续 998','首季度 2,595 元'],['基础预计使用','—','13,095 元'],['首季度预算上限','—','约 15,000 元']],note:'约 1.31 万基础预算 + 约 0.19 万机动空间。'}},tw:null};DATA.tw=JSON.parse(JSON.stringify(DATA.cn));DATA.tw.nav=['建立帳號目標','目標人群','帳號定位','內容','工作流程','數據回顧','需要支持'];DATA.tw.goal.title='先把帳號做成會被記住、也會被喜歡的新社群入口。';DATA.tw.goal.lead='兩個新帳號不會只是新品通知或產品圖搬運。先讓內容本身值得看，再讓使用者在看的過程中發現：喔，原來這是 KENZO。';DATA.tw.goal.quote='圍繞產品，創意地玩。';const S={lang:'cn',world:'xhs',chapter:0,ctab:0,wtab:0};const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));const C=()=>DATA[S.lang],N=()=>C().nav,K=['goal','audience','position','content','workflow','data','support'],ch=()=>C()[K[S.chapter]],esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function entryState(){$$('[data-a="lang"]').forEach(b=>b.classList.toggle('on',b.dataset.v===S.lang));$$('[data-a="world"]').forEach(b=>b.classList.toggle('on',b.dataset.v===S.world))}function top(){if(S.world==='xhs')return `<div class="head xhead"><div class="status"><span>17:44</span><span>●●● ▰</span></div><div class="profile"><button class="back" data-a="reset">‹</button><div class="avatar">K</div><div class="name">KENZO China</div><button class="follow">Follow</button><span>↗</span></div><div class="strip"><button class="pill" data-a="guide">☰</button>${N().map((n,i)=>`<button class="pill ${i===S.chapter?'on':''}" data-a="go" data-v="${i}">${String(i+1).padStart(2,'0')} ${esc(n)}</button>`).join('')}</div></div>`;return `<div class="head dhead"><div class="status"><span>17:44</span><span>●●● ▰</span></div><div class="dline"><button data-a="reset">‹</button><span>KENZO China</span><button data-a="guide">☰</button></div><div class="dtabs"><span>首页</span><span>关注</span><b>推荐</b><span>商城</span></div><div class="strip">${N().map((n,i)=>`<button class="pill ${i===S.chapter?'on':''}" data-a="go" data-v="${i}">${esc(n)}</button>`).join('')}</div></div>`}function rows(a){return a.map(x=>`<div class="row"><b>${esc(x[0])}</b><p>${esc(x[1])}</p></div>`).join('')}function dirs(){return ch().dirs.map((x,i)=>`<div class="dir"><small>0${i+1}${x.main?'<span class="badge">MAIN</span>':''}</small><h3>${esc(x.name)}</h3><p><b>${esc(x.tag)}</b><br><br>${esc(x.desc)}<br><br>${esc(x.persona)}</p><div class="split"><div><b>小红书</b><p>${esc(x.xhs)}</p></div><div><b>抖音</b><p>${esc(x.dy)}</p></div></div></div>`).join('')}function contentBlock(){let d=ch(),h=`<div class="sec"><div class="slab">CREATIVE CONTENT</div><div class="tabs">${d.tabs.map((t,i)=>`<button class="tab ${i===S.ctab?'on':''}" data-a="ctab" data-v="${i}">${esc(t)}</button>`).join('')}</div>`;if(S.ctab===0)h+=`<div class="rail"><button class="case" data-a="case" data-v="0"><div class="caseArt receipt"></div><div><b>LOOK RECEIPT · 发票</b></div></button><button class="case" data-a="case" data-v="1"><div class="caseArt collage"></div><div><b>PRODUCT COLLAGE · 拼贴</b></div></button><button class="case" data-a="case" data-v="2"><div class="caseArt bouquet"></div><div><b>KENZO BOUQUET · 包装成鲜花</b></div></button></div>`;else h+=`<div class="refs">${['ROMI STUDIO Bouquet','Live Motion','Paper Cutout','Word Drag','Outfit Receipt','Grid Game'].map((x,i)=>`<button class="ref" data-a="ref"><div class="refArt">${esc(x)}</div><b>${esc(x)}</b></button>`).join('')}</div>`;return h+'</div>'}function workflow(){let d=ch(),a=S.wtab===0?d.week1:S.wtab===1?d.weekly:S.wtab===2?d.months:null;return `<div class="sec"><div class="slab">WORKFLOW</div><div class="tabs">${d.tabs.map((t,i)=>`<button class="tab ${i===S.wtab?'on':''}" data-a="wtab" data-v="${i}">${esc(t)}</button>`).join('')}</div>${a?rows(a):`<div class="quote" style="margin-top:12px">${esc(d.long)}</div>`}</div>`}function budget(){return `<div class="sec"><div class="slab">Q1 BUDGET</div><div class="table">${ch().budget.map(r=>`<div class="tr">${r.map(c=>`<div>${esc(c)}</div>`).join('')}</div>`).join('')}</div><div class="row"><p>${esc(ch().note)}</p></div></div>`}function details(){if(S.chapter===0)return `<div class="sec">${rows(ch().items)}<div class="quote">“${esc(ch().quote)}”</div></div>`;if(S.chapter===1)return `<div class="sec">${rows(ch().items)}</div>`;if(S.chapter===2)return `<div class="sec">${dirs()}</div>`;if(S.chapter===3)return contentBlock();if(S.chapter===4)return workflow();if(S.chapter===5)return `<div class="sec">${rows(ch().items)}</div>`;return `<div class="sec">${rows(ch().items)}</div>${budget()}`}function xhs(){let d=ch(),lead=S.chapter===5?d.xhs:d.lead;return `<div class="visual"><div class="shade"></div><div class="ctxt"><small>KENZO SOCIAL WORLDS · ${String(S.chapter+1).padStart(2,'0')}</small><h1>${esc(d.title)}</h1></div></div><div class="body"><h2>${esc(d.title)}</h2>${lead?`<div class="lead">${esc(lead)}</div>`:''}${details()}</div>`}function dy(){let d=ch(),lead=S.chapter===5?d.dy:d.lead;return `<div class="dpage"><div class="dmedia"></div><div class="dshade"></div><div class="side"><div class="bubble">♥</div><small>2.1w</small><div class="bubble">☆</div><small>569</small><div class="bubble">↗</div><small>share</small></div><div class="dtext"><b>@ KENZO China</b><h2>${esc(d.title)}</h2><p>${esc(lead||'')}</p><button class="more" data-a="detail">查看方案</button></div></div>`}function render(){document.querySelector('#app').className='app on '+(S.world==='dy'?'dy':'xhs');$('#content').innerHTML=top()+(S.world==='xhs'?xhs():dy());$('#progress').textContent=`${String(S.chapter+1).padStart(2,'0')} / 07`;$('#scroll').scrollTop=0;$('#glist').innerHTML=N().map((n,i)=>`<button class="gitem ${i===S.chapter?'on':''}" data-a="go" data-v="${i}"><small>${String(i+1).padStart(2,'0')}</small><b>${esc(n)}</b></button>`).join('')}function showDetail(title,body){$('#dtitle').textContent=title;$('#dbody').innerHTML=body;$('#detail').classList.add('show')}document.addEventListener('click',e=>{let b=e.target.closest('[data-a]');if(!b)return;let a=b.dataset.a,v=b.dataset.v;if(a==='lang'){S.lang=v;entryState()}else if(a==='world'){S.world=v;entryState()}else if(a==='nextstep'){$('#langstep').classList.add('hide');$('#worldstep').classList.remove('hide')}else if(a==='backstep'){$('#worldstep').classList.add('hide');$('#langstep').classList.remove('hide')}else if(a==='enter'){$('#entry').classList.add('hide');render()}else if(a==='reset'){$('#app').classList.remove('on');$('#entry').classList.remove('hide');$('#langstep').classList.remove('hide');$('#worldstep').classList.add('hide')}else if(a==='guide'){$('#guide').classList.add('show')}else if(a==='closeguide'){$('#guide').classList.remove('show')}else if(a==='closedetail'){$('#detail').classList.remove('show')}else if(a==='go'){S.chapter=+v;$('#guide').classList.remove('show');render()}else if(a==='prev'){if(S.chapter>0){S.chapter--;render()}}else if(a==='next'){if(S.chapter<6){S.chapter++;render()}}else if(a==='ctab'){S.ctab=+v;render()}else if(a==='wtab'){S.wtab=+v;render()}else if(a==='case'){showDetail('Creative Case',`<div class="row"><p>这里是案例详情入口。正式版会把你已经确认的 Receipt Live、拼贴动态图和 Bouquet 动态案例接进来。</p></div>`)}else if(a==='ref'){showDetail('Reference',`<div class="row"><p>这里是参考视频 / 图文入口。正式版会直接打开你刚刚发来的原视频和图片。</p></div>`)}else if(a==='detail'){showDetail(N()[S.chapter],details())}});entryState();</script></body></html>
