und:#171717;color:#fff;border-color:#292929}.app.dy .gitem.on{background:#fff;color:#111}.switches{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.switches button{border:1px solid #eee;background:#fff;border-radius:13px;padding:11px;font-size:11px}.app.dy .switches button{background:#171717;color:#fff;border-color:#292929}@media(min-width:700px){.app{padding:14px 0}.phone{border-radius:32px;box-shadow:0 20px 70px #0008}}</style></head><body><div class="root"><section id="entry" class="entry"><div class="entryBox"><div class="logo">KENZO</div><div class="eyebrow">SOCIAL WORLDS · 0–1</div><div class="entryTitle">— 关于新账号的创意发想 Mona</div><div id="langStep" class="entryStep"><div class="stepLabel">LANGUAGE</div><div class="choices"><button class="choice on" data-a="lang" data-v="cn"><b>简体中文</b><small>Mainland China</small></button><button class="choice" data-a="lang" data-v="tw"><b>繁體中文</b><small>Taiwan</small></button></div><button id="toWorld" class="primary" data-a="worldStep">下一步</button></div><div id="worldStep" class="entryStep hide"><div class="stepLabel">CHOOSE YOUR WORLD</div><div class="choices"><button class="choice on" data-a="world" data-v="xhs"><b>小红书世界</b><small>图文 / Live 图 / 收藏感</small></button><button class="choice" data-a="world" data-v="dy"><b>抖音世界</b><small>视频 / 变化 / 停留感</small></button></div><button class="primary" data-a="enter">进入体验</button><button class="secondary" data-a="backStep">返回上一步</button></div></div></section><section id="app" class="app"><div class="phone"><div id="scroll" class="scroll"><div id="content"></div></div><div class="present"><button id="prev" class="prev" data-a="prev">上一章</button><div id="progress" class="progress"></div><button id="next" class="next" data-a="next">下一章</button></div><div id="guide" class="sheetWrap"><div class="overlay" data-a="closeGuide"></div><div class="sheet"><div class="grab"></div><div class="shead"><div><h3>导览</h3><div class="sheetLead">点哪个就进入哪个部分；小红书和抖音的内容已经分开写。</div></div><button data-a="closeGuide">×</button></div><div id="guideList" class="guideList"></div><div class="switches"><button data-a="toggleLang">繁體 / 简体</button><button data-a="toggleWorld">切换平台世界</button></div></div></div><div id="detail" class="sheetWrap"><div class="overlay" data-a="closeDetail"></div><div class="sheet"><div class="grab"></div><div class="shead"><h3 id="detailTitle"></h3><button data-a="closeDetail">×</button></div><div id="detailLead" class="sheetLead"></div><div id="detailBody"></div></div></div></div></section></div><script>const LOOKS=['https://media.kenzo.com/b2cprd/content/default/SS27%20SHOW%20%26%20LA%20FETE%20DE%20KENZO/KENZO_SS27_LOOK_01_4-5.jpg?twic=v1%2Fresize%3D750','https://media.kenzo.com/b2cprd/content/default/SS27%20SHOW%20%26%20LA%20FETE%20DE%20KENZO/KENZO_SS27_LOOK_02_4-5.jpg?twic=v1%2Fresize%3D750','https://media.kenzo.com/b2cprd/content/default/SS27%20SHOW%20%26%20LA%20FETE%20DE%20KENZO/KENZO_SS27_LOOK_03_4-5.jpg?twic=v1%2Fresize%3D750','https://media.kenzo.com/b2cprd/content/default/SS27%20SHOW%20%26%20LA%20FETE%20DE%20KENZO/KENZO_SS27_LOOK_04_4-5.jpg?twic=v1%2Fresize%3D750'];const NAV=['创建账号目标','目标人群','账号定位','内容','工作流程','数据复盘','需要支持'];const X={goal:{title:'小红书先把产品变成一条值得停下来的笔记',lead:'小红书不是把官网、Campaign 或产品图换个标题再发一遍。它更适合把一个真实的产品点慢慢展开，让用户先被画面吸引，再在翻页和细节里重新认识 KENZO。',rows:[['平台承担的角色','小红书负责“展开”。一条内容里可以有封面、完整 Look、局部细节、拼贴、文字说明和最后的产品回看。用户不是只看一秒，而是愿意翻、愿意停、愿意收藏。'],['账号核心','围绕产品，创意地玩。创意一定从真实产品里长出来：颜色、线条、图案、刺绣、领口、口袋、材质、版型、Logo、搭配关系，都可以成为内容起点。'],['一条笔记应该怎么走','第一张先给一个明确的视觉钩子；第二到第四张把细节展开；中间解释为什么从这个细节想到这个玩法；最后回到完整 Look 或产品，让创意重新落回衣服本身。'],['最终想留下的感觉','不是“这个品牌好会做图”，而是“原来 KENZO 现在可以这么看”“这件以前没注意到”“同样是一件衣服，KENZO 总能找到一个不太普通的打开方式”。']],quote:'小红书：先让人停下来翻，再让创意把注意力送回产品。'},audience:{title:'小红书要争取的，不是“越年轻越好”',lead:'小红书的拉新靠视觉和表达，但品牌不能被做轻。内容要同时照顾新客、原本认识 KENZO 的成熟用户，以及自然进入的年轻人。',rows:[['优先争取的人','25–35 岁左右，对穿搭、生活方式和品牌气质已经有判断，也知道一些奢侈品牌，但 KENZO 还不是他们会主动想到的第一选择。最希望看到的反应是：“原来 KENZO 现在是这样”“这件还挺好看”“这个细节以前没注意过”。'],['需要维稳的人','已经认识 KENZO、具备消费基础的成熟用户。创意可以给他们新鲜感，但新品、真实产品细节、搭配、品牌质感和信息准确度必须站得住。'],['自然进入的年轻用户','更年轻的人未必马上购买，但可以先通过封面、玩法、收藏和分享记住 KENZO。短期是流量和讨论，长期是未来认知。'],['内容原则','形式把新人吸引进来，产品把原本喜欢 KENZO 的人留下。不能只做“年轻感”，也不能回到传统奢侈品牌那种端着的图文。']]},position:{title:'小红书定位：三个方向都能做，但主推先从“细节”开始',lead:'三个方向不是三个账号，而是同一个账号里三种稳定的创意入口。小红书最适合把“从哪里开始”这件事做得很完整。',dirs:[['01 · MAIN','顺着细节跑偏','玩的是：从哪里开始。','从一个真实可见的小细节开始，把它做成视觉线索，再一路带到其它细节和完整 Look。颜色、线条、刺绣、纽扣、口袋、领口、印花、材质、轮廓都可以，但这个细节必须真的存在于产品里。','完整 Look → 细节特写 → 连线 / 拼贴 / 放大 → 继续带出其它产品信息 → 回到完整 Look。'],['02','换个方式出场','玩的是：怎么出现。','不在第一张就把整套 Look 全交代完，而是重新安排产品被看到的顺序。先颜色、局部、背面、轮廓，再慢慢走到完整产品。','首图只露一个引子；后面用翻页控制信息：局部 → 轮廓 → 完整 Look。也可以用碎片、裁切、背面到正面。'],['03','衣服换个说法','玩的是：最后变成什么。','把产品翻译成一个熟悉但意外的视觉语言：Receipt、花束、档案、卡牌、说明书、清单、包装。第一眼先被形式吸引，第二眼发现里面讲的全是产品。','最适合做“一眼成立”的封面：Receipt / Bouquet / Product File。点进去以后再拆解每件衣服怎么被翻译。']],closing:'第一个玩“从哪里开始”，第二个玩“怎么出现”，第三个玩“最后变成什么”。'},content:{title:'小红书内容：一件衣服，不只发一次“产品图”',lead:'先从真实产品点出发，再决定它应该变成拼贴、Live 图、Receipt、花束还是翻页故事。重点不是每次发明新特效，而是把有效玩法慢慢做成账号自己的视觉习惯。',rows:[['内容来源','颜色 / 线条 / 图案 / 刺绣 / 版型 / 材质 / 口袋 / 领口 / Logo / 搭配关系。先问“这件产品到底哪里值得玩”，再决定形式。'],['首月内容比例','约 70% 轻量图文与 Live 图：拼贴、细节、标签、排版、连线；20% 中等制作：翻页 reveal、纸片、抽卡、轻动态；10% 留给真正值得做复杂一点的重点内容。'],['一条内容的基本素材','完整 Look、正侧背、上半身、面料 / Logo / 细节、干净背景抠图、手拿产品、少量自然动作。这样同一件产品可以做出多张有关系的图，而不是一张图配一段话。']],cases:true},workflow:{title:'小红书工作流：先把图文和 Live 图稳定跑起来',lead:'前期不追求每条都做很大。核心是一个人可以持续完成选题、拍摄、排版、发布和复盘。',tabs:['第一周','每周节奏','前三个月','长期目标'],week1:[['DAY 01 · 账号基础','完成注册 / 认证 / 权限、名字 / 头像 / 简介 / 首页基础视觉；确认主定位和首月图文视觉语言。'],['DAY 02 · 第一批选题','选 3–4 个核心主题，明确：哪件产品、哪个真实细节、封面钩子、翻页结构、制作难度。'],['DAY 03 · 素材拍摄','集中拍完整 Look、正侧背、上半身、细节、材质、干净底图和少量 Live 动作。'],['DAY 04 · 制作','完成排版、拼贴、封面、标题、正文、Live 图；同一主题至少准备 2 个封面版本。'],['DAY 05 · 发布 + 记录','首批内容上线或排期，建立数据表；记录封面、题材、产品点、形式和制作时间。']],weekly:[['周一','复盘上周数据 + 确定本周约 3 个核心主题。'],['周二','确定 Look / 产品 / 小道具 / Shot List，提前准备拼贴、抠图、打印等素材。'],['周三','集中拍 2–3 个主题的静态 + Live 素材。'],['周四','集中做图文排版、标题、正文、封面。'],['周五','补拍、发布、记录数据，把值得复用的模板留下。']],months:[['MONTH 01 · TEST','先知道什么有效。建立账号自己的 Baseline；测试不同产品、真实细节、封面、翻页顺序、Live 图与静态图，月底找到 2–3 种明显值得继续的内容方式。'],['MONTH 02 · REPEAT','70% 重复已经有正反馈的方向，30% 保留新测试。同一种玩法换不同产品至少再做 2–3 次，验证不是偶然。'],['MONTH 03 · STABILIZE','稳定封面结构、图文节奏、文案语气、基础拍摄标准和 3–5 个数据验证过的长期方向。']],long:'当账号已经有稳定的内容习惯，再自然承接新品、重点单品、Campaign、门店、活动、电商节点、产品故事和品牌文化。长期不是无限想 gimmick，而是让用户看到某种画面时，会觉得“这个玩法很像 KENZO”。'},data:{title:'小红书数据：先看用户愿不愿意点开、收藏和继续认识品牌',lead:'前期先建立自己的 Baseline，不拿行业里一个固定数字硬套。每周看均值 / 中位数，再判断哪种内容值得复制。',rows:[['核心路径','曝光 → 打开 / 阅读 → 收藏 / 分享 → 主页访问 → 关注。'],['重点记录','曝光、点击 / 打开率、阅读、点赞、收藏、评论、分享、主页访问、涨粉；后台如果有搜索来源也一起记录。'],['最值得看的四个信号','打开：封面有没有作用；收藏：内容有没有留下价值；主页访问：创意有没有让人想继续看品牌；关注：账号是不是开始建立长期期待。'],['评论语义也要看','“这个创意好有意思”说明形式成立；“这件 KENZO 竟然还挺好看 / 这个细节以前没注意到”更重要，说明创意真的把注意力送回了产品。']],rules:[['KEEP','同一种形式换不同产品连续做 2–3 次仍高于自己的 Baseline，而且制作量可控，就留下。'],['TEST AGAIN','有信号但不稳定，一次只改一个变量：封面、产品、标题或翻页顺序。'],['PAUSE','连续低于 Baseline、制作又很耗时的内容先停，不因为“看起来很有创意”硬做。']],monthly:['哪类产品最容易让人点开？','哪个真实细节最容易变成内容入口？','哪种封面最有效？','哪种玩法只让人记住创意，却没记住产品？','哪些内容开始改变用户对 KENZO 的印象？','什么制作最耗时但数据一般？']},support:{title:'小红书需要的支持：把产品、素材和薯条测试提前配好',lead:'小红书前期最需要的是稳定的产品素材、轻量制作条件和可控的小额投放测试，不需要一开始就做大制作。',rows:[['产品 / 素材','重点产品、样衣借用、高分辨率产品图、Lookbook、Campaign 基础素材尽量提前同步；信息、价格、上市时间在制作前确认。'],['拍摄','手机 / 相机、三脚架、补光灯；以静态、细节和 Live 图为主，少量小道具即可。真人只在真的有必要时出现。'],['制作','即梦高级会员 + 现有修图 / 排版工具，用于动态拼贴、局部变化、背景延展和多版本测试。AI 不改真实颜色、版型、Logo 和设计细节。'],['薯条','当前账号后台可投最低档是 75 元 / 篇。首阶段不平均撒：每月约 12 篇里先选 6 篇 × 150 元测试；其中表现最好的 2 篇再各追加 300 元。约 1,500 元 / 月，首季度约 4,500 元。']],budget:[['小红书薯条','约 ¥1,500 / 月','约 ¥4,500 / Q1'],['即梦高级会员（项目共用）','首月 ¥599，续费 ¥998','Q1 ¥2,595'],['项目整体基础预算','—','¥13,095'],['建议申请上限','—','¥15,000']]}};const Y={goal:{title:'抖音先把账号做成“刷到会停一下”的 KENZO',lead:'抖音不适合先讲很多品牌信息。第一步是让一条内容在前 3 秒发生一个明确变化，让人停住；第二步再让这个变化和产品本身发生关系。',rows:[['平台承担的角色','抖音负责“变化”。每条视频最好只有一个非常清楚的触发：拉、拖、翻、扫、靠近、遮挡、抽卡、放大。变化发生以后，用户要知道自己刚才看的是哪件 KENZO。'],['账号核心','围绕产品，创意地玩。不是搞笑，不是追低龄热点，也不是为了特效硬变。所有变化都从真实产品细节、颜色、轮廓、搭配或动作出发。'],['一条视频应该怎么走','0–3 秒：先出现钩子 / 动作；3–5 秒：变化发生；中段：把产品或 Look 看清；结尾：回到产品记忆点。能 8–15 秒讲清楚就不拖。'],['最终想留下的感觉','“刚才那个变化好像就是从衣服里长出来的。”用户先因为动作停下来，再因为产品记住 KENZO。']],quote:'抖音：一个视频只做一个看得见的变化。'},audience:{title:'抖音要抓的是“愿意停一下的人”，不是先筛购买力',lead:'抖音的第一层竞争是停留。先让对穿搭、视觉和新奇表达敏感的人停住，再让产品质感决定他们会不会继续看账号。',rows:[['优先争取的人','25–35 岁左右，对穿搭、品牌和生活方式有判断，但 KENZO 不是默认选择。视频要先打破他们“我大概知道 KENZO 是什么”的旧印象。'],['需要维稳的人','已经认识 KENZO 的成熟用户。即使视频节奏更快，也不能牺牲产品真实性、品牌质感、Logo / 版型 / 颜色准确度。'],['自然进入的年轻用户','抖音会自然带来更年轻的人。短期不要求立刻购买，先通过变化、评论、转发和主页访问建立记忆。'],['内容原则','不为了“年轻”做梗，也不做传统品牌广告感。画面可以轻、动作可以玩，但产品必须一直是主角。']]},position:{title:'抖音定位：三个方向都要“动起来”',lead:'同样是三个方向，但在抖音里不能只做静态排版。每个方向都必须有一个清楚的触发和变化。',dirs:[['01 · MAIN','顺着细节跑偏','玩的是：从哪里开始。','从一个真实细节触发变化：线条被拉长、颜色被拖动、口袋被拉开、徽章被移动，下一段内容才出现。','拉一条线看完整 Look；拖一个颜色切不同搭配；拉开口袋带出下一件；拖徽章切到对应细节；抽卡牌换一套造型。'],['02','换个方式出场','玩的是：怎么出现。','产品不直接平铺出现，而是通过一个动作被 reveal。关键是动作要简单、可复制、第一秒看得懂。','划过镜头、遮镜头、靠近、拉远、翻卡、手从画面外拉进产品，最后完整 Look 出场。'],['03','衣服换个说法','玩的是：最后变成什么。','让转换过程真的发生，不只是最后摆一张效果图。','完整 Look → 扫描识别 → Receipt 打印；几件衣服进入画面 → 被整理 → 包成花束；产品被拖进格子 → 自动组成一套 Look。']],closing:'抖音最重要的不是“形式有多复杂”，而是变化够不够清楚、够不够快、最后有没有回到产品。'},content:{title:'抖音内容：把“玩法库”变成可以一直复用的动作',lead:'前期不要一条视频塞太多东西。一个动作、一个变化、一个产品记忆点，反而更容易做，也更容易复盘。',rows:[['内容来源','颜色、线条、徽章、口袋、领口、Logo、搭配、面料、轮廓都可以变成触发器。先找到“哪一个点一动就成立”，再设计镜头。'],['首月制作比例','约 70% 轻量：定机位 + 拉 / 拖 / 翻 / 遮挡 / 局部变化；20% 中等：多素材拼接、扫描识别、卡牌、格子；10% 留给真正值得做复杂的重点单品或节点。'],['视频素材标准','完整 Look、上半身、局部特写、手部动作、5–10 秒稳定画面、干净背景产品、前后状态。拍的时候就为第一帧和变化点留素材。']],refs:true},workflow:{title:'抖音工作流：先稳定做到每周 2–3 条，不靠复杂拍摄撑量',lead:'视频要有刷感，但制作流程必须足够轻，否则一个人很容易被剪辑和特效拖死。',tabs:['第一周','每周节奏','前三个月','长期目标'],week1:[['DAY 01 · 账号基础','完成注册 / 认证 / 权限、头像 / 简介 / 首页基础视觉；确认主定位和视频第一帧风格。'],['DAY 02 · 第一批动作','选 3–4 个主题，每个只写清：哪件产品、哪个真实细节、第一帧、触发动作、变化发生在哪一秒。'],['DAY 03 · 集中拍摄','同一机位优先，一次拍完整 Look、特写、手部动作、前后状态和 5–10 秒稳定素材。'],['DAY 04 · 剪辑','先剪短版本，检查 3 秒内有没有动作、变化是否清楚、产品有没有看清；必要时再加 AI 局部动态。'],['DAY 05 · 上线 + 数据','发布或排期首批视频，记录 3 秒 / 5 秒、平均观看、完播、主页访问、涨粉和制作时间。']],weekly:[['周一','复盘留存和完播 + 确定本周约 2–3 个视频主题。'],['周二','写第一帧 / 触发动作 / Shot List，准备需要的卡牌、线条、标签或小道具。'],['周三','集中拍摄，尽量定机位一次拿齐。'],['周四','剪辑 + 动态 + 第一帧；同一条先做短版。'],['周五','补拍、发布、记录变化发生位置和掉点。']],months:[['MONTH 01 · TEST','建立自己的 Baseline；测试不同第一帧、不同触发动作、变化发生时间和视频长度，月底至少找到 2–3 种明显值得继续的开场 / 变化方式。'],['MONTH 02 · REPEAT','70% 重复已经有效的动作，30% 新测试。同一个“拉线 / 拖拽 / 扫描 / reveal”换不同产品做 2–3 次，判断它是不是账号自己的玩法。'],['MONTH 03 · STABILIZE','稳定第一帧、镜头距离、变化节奏、视频时长和 3–5 个可持续动作模板，让一条视频的制作时间进入可控范围。']],long:'内容方式跑通后，再把新品、重点单品、Campaign、门店、活动、电商节点、产品故事和品牌文化放进这些已经有效的动作里。用户先认出“这个玩法像 KENZO”，再认出具体产品。'},data:{title:'抖音数据：先盯前 3 秒，再看变化之后有没有继续看',lead:'抖音前期最重要的是自己的留存曲线，不是只看播放量。每条视频都要知道：用户在哪一秒走、变化发生在哪一秒。',rows:[['核心路径','播放 → 3 秒 → 5 秒 → 平均观看 / 完播 → 主页访问 → 关注。'],['重点记录','播放、3 秒 / 5 秒留存、平均观看时长、完播、点赞、评论、分享、主页访问、涨粉。后台能看到留存曲线时，把变化发生位置一起标记。'],['最值得看的四个信号','前 3 秒：第一帧和动作能不能拦住；变化点：用户有没有等到变化发生；平均观看 / 完播：节奏是否拖；主页访问：这条内容有没有把兴趣带到账号。'],['评论语义','如果大家只讨论“特效怎么做”，说明形式太抢；如果开始说“这件衣服不错 / KENZO 现在这样了？”才说明产品被记住。']],rules:[['KEEP','同一个动作换不同产品 2–3 次仍高于自己的 Baseline，而且制作量可控，就做成系列。'],['TEST AGAIN','有停留但完播不稳定，只改一个变量：第一帧、动作速度、变化时间或视频长度。'],['PAUSE','连续几次留存弱、制作又重的形式先停。']],monthly:['哪种第一帧最容易停住？','变化放在第几秒最合适？','哪种动作最适合 KENZO 产品？','哪些视频用户只记住特效没记住产品？','什么时长最适合当前账号？','哪种玩法制作太重，不值得长期做？']},support:{title:'抖音需要的支持：稳定拍摄条件 + 动态制作 + DOU+ 测试',lead:'抖音需要的是能持续拍、持续动、持续测，不是每条都上大团队。',rows:[['产品 / 素材','重点产品、样衣、可提前拿到的新品信息和高分辨率素材；需要动作时，产品必须能真实拍到，而不是只靠 AI 生成。'],['拍摄','手机 / 相机、三脚架、补光灯、手持稳定器，少量小型道具。优先定机位和简单动作，减少一个人反复搭景。'],['制作','即梦高级会员 + 现有剪辑工具，用于图生视频、局部动态、背景延展、多版本第一帧。AI 不改变真实颜色、版型、Logo、设计细节。'],['DOU+','参考官方案例先从 100–200 元起测。计划每月约 10 条里选 6 条 × 200 元测试；其中最好的 2 条再各追加 400 元。约 2,000 元 / 月，首季度约 6,000 元。不是平均投，每次只给已经有自然正反馈的内容加。']],budget:[['抖音 DOU+','约 ¥2,000 / 月','约 ¥6,000 / Q1'],['即梦高级会员（项目共用）','首月 ¥599，续费 ¥998','Q1 ¥2,595'],['项目整体基础预算','—','¥13,095'],['建议申请上限','—','¥15,000']]}};const T={cn:{xhs:X,dy:Y},tw:null};T.tw=T.cn;const S={lang:'cn',world:'xhs',chapter:0,tab:0};const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const D=()=>T[S.lang][S.world][['goal','audience','position','content','workflow','data','support'][S.chapter]];const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function hero(i){let cls=['goal','audience','position','content','workflow','data','support'][i],extra='';if(i===0)extra='<span class="tile t1">PRODUCT</span><span class="tile t2">PLAY</span><span class="tile t3">DETAIL</span>';if(i===1)extra='<i class="ring r3"></i><i class="ring r2"></i><i class="ring r1"></i>';if(i===2)extra='<i class="detailLine"></i><i class="detailDot"></i>';if(i===5)extra='<div class="bars"><i></i><i></i><i></i><i></i><i></i></div>';return `<div class="hero ${cls}"><img src="${LOOKS[i%LOOKS.length]}" alt="KENZO SS27 Look"><span class="liveBadge">${S.world==='xhs'?'LIVE':'MOTION'}</span>${extra}<div class="heroCap"><small>KENZO SOCIAL WORLDS · ${String(i+1).padStart(2,'0')}</small><h1>${NAV[i]}</h1></div></div>`}function rows(a){return a.map(x=>`<div class="row"><b>${esc(x[0])}</b><p>${esc(x[1])}</p></div>`).join('')}function dirs(a){return a.map(x=>`<div class="dir"><small>${esc(x[0])}</small><h3>${esc(x[1])}</h3><p><b>${esc(x[2])}</b><br><br>${esc(x[3])}</p><div class="platformBox"><b>${S.world==='xhs'?'小红书怎么做':'抖音怎么做'}</b><p>${esc(x[4])}</p></div></div>`).join('')}function cases(){let img1=LOOKS[0],img2=LOOKS[1],img3=LOOKS[2];return `<div class="section"><div class="slab">3 个自己的案例 · 动态预览</div><div class="cards"><button class="card" data-a="case" data-v="0"><div class="caseVisual"><img src="${img1}"><div class="slot"></div><div class="receiptPaper"></div></div><div class="cardText"><b>LOOK RECEIPT · 发票</b><p>先看一张 Receipt，再回到真实 Look 和单品。</p></div></button><button class="card" data-a="case" data-v="1"><div class="caseVisual"><img class="collagePiece cp1" src="${img1}"><img class="collagePiece cp2" src="${img2}"><img class="collagePiece cp3" src="${img3}"><div class="yellowLine"></div></div><div class="cardText"><b>PRODUCT COLLAGE · 拼贴</b><p>细节和产品一块一块出现，最后拼成完整视觉。</p></div></button><button class="card" data-a="case" data-v="2"><div class="caseVisual"><img class="bouquetImg" src="${img3}"><div class="wrapPaper"></div><div class="bow"></div></div><div class="cardText"><b>KENZO BOUQUET · 包装成鲜花</b><p>衣服逐渐被整理和包裹，最后变成一束“服装花束”。</p></div></button></div></div>`}function refs(){const refs=[['Paper Cutout','纸片 / 拼贴 OOTD。制作轻，重点是每一片出现的节奏。','cut'],['Scale Shift','比例突然变化，让第一眼就有停留点。','scale'],['Grid Game','格子 / 选择 / 抽卡，把“选 Look”做成动作。','grid'],['Outfit Receipt','扫描、识别、打印，把一套 Look 变成 Receipt。','receipt'],['Word Drag','拖动一个词或细节，触发下一段画面。','drag'],['Live Visual','静态封面点进去以后会动，适合小红书 Live 图。','live']];return `<div class="section"><div class="slab">参考玩法 · 清晰动态模拟</div><div class="cards">${refs.map((r,i)=>`<button class="card" data-a="ref" data-v="${i}"><div class="refVisual"><img src="${LOOKS[(i+1)%4]}"><span class="refTag">REF · ${r[0].toUpperCase()}</span>${r[2]==='cut'?'<i class="cutPiece q1"></i><i class="cutPiece q2"></i><i class="cutPiece q3"></i>':''}${r[2]==='grid'?'<div class="gridGame">'+('<i></i>'.repeat(9))+'</div>':''}${r[2]==='drag'?'<div class="dragWord">DRAG →</div>':''}${r[2]==='receipt'?'<div class="receiptPaper"></div>':''}${r[2]==='scale'?'<div class="detailDot" style="left:49%;top:47%;background:#fff;width:70px;height:70px;animation:float 2s infinite"></div>':''}${r[2]==='live'?'<div class="yellowLine"></div>':''}</div><div class="cardText"><b>${r[0]}</b><p>${r[1]}</p></div></button>`).join('')}</div></div>`}function workflow(){const d=D(),a=[d.week1,d.weekly,d.months,[["长期目标",d.long]]][S.tab];return `<div class="section"><div class="tabs">${d.tabs.map((t,i)=>`<button class="tab ${S.tab===i?'on':''}" data-a="tab" data-v="${i}">${t}</button>`).join('')}</div><div class="checklist">${a.map(x=>`<div class="check"><b>${esc(x[0])}</b><p>${esc(x[1])}</p></div>`).join('')}</div></div>`}function detail(){const d=D();if(S.chapter===0)return `<div class="section"><div class="slab">ROLE</div>${rows(d.rows)}<div class="quote">${esc(d.quote)}</div></div>`;if(S.chapter===1)return `<div class="section"><div class="slab">AUDIENCE</div>${rows(d.rows)}</div>`;if(S.chapter===2)return `<div class="section"><div class="slab">3 DIRECTIONS</div>${dirs(d.dirs)}<div class="quote">${esc(d.closing)}</div></div>`;if(S.chapter===3)return `<div class="section"><div class="slab">CONTENT METHOD</div>${rows(d.rows)}</div>${S.world==='xhs'?cases():refs()}`;if(S.chapter===4)return workflow();if(S.chapter===5)return `<div class="section"><div class="slab">MEASURE</div>${rows(d.rows)}<div class="checklist">${d.rules.map(x=>`<div class="check"><b>${x[0]}</b><p>${x[1]}</p></div>`).join('')}</div></div><div class="section"><div class="slab">MONTHLY QUESTIONS</div><ul class="monthly">${d.monthly.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;return `<div class="section"><div class="slab">SUPPORT</div>${rows(d.rows)}</div><div class="section"><div class="slab">Q1 BUDGET</div><div class="budget"><div class="tr head"><div>ITEM</div><div>MONTH</div><div>Q1</div></div>${d.budget.map(r=>`<div class="tr">${r.map(c=>`<div>${c}</div>`).join('')}</div>`).join('')}</div></div>`}function xHeader(){return `<div class="head xhead"><div class="status"><span>20:39</span><span>●●● ▰</span></div><div class="profile"><button class="back" data-a="reset">‹</button><div class="avatar">K</div><div class="name">KENZO China</div><button class="follow">Follow</button><div class="share">↗</div></div><div class="chapterStrip"><button class="pill menu" data-a="guide">☰</button>${NAV.map((n,i)=>`<button class="pill ${i===S.chapter?'on':''}" data-a="go" data-v="${i}">${String(i+1).padStart(2,'0')} ${n}</button>`).join('')}</div></div>`}function dHeader(){return `<div class="head dyHead"><div class="status"><span>20:39</span><span>●●● ▰</span></div><div class="dyLine"><button data-a="reset">‹</button><span>KENZO China</span><button data-a="guide">☰</button></div><div class="dyTabs"><span>首页</span><span>关注</span><b>推荐</b><span>商城</span></div><div class="dyStrip"><button class="pill" data-a="guide">${String(S.chapter+1).padStart(2,'0')}/07</button>${NAV.map((n,i)=>`<button class="pill ${i===S.chapter?'on':''}" data-a="go" data-v="${i}">${n}</button>`).join('')}</div></div>`}function xPage(){let d=D();return `${hero(S.chapter)}<div class="pager"><i class="on"></i><i></i><i></i></div><div class="note"><h2>${d.title}</h2><div class="lead">${d.lead}</div><div class="tags">#KENZO #小红书新账号 #${NAV[S.chapter]}</div>${detail()}</div><div class="xactions"><div class="comment">说点什么…</div><div class="act"><span>♡</span>1,208</div><div class="act"><span>☆</span>256</div><div class="act"><span>◌</span>28</div></div>`}function dPage(){let d=D();return `<div class="reel">${hero(S.chapter)}<div class="side"><div class="bubble">♥</div><small>2.1w</small><div class="bubble">◌</div><small>1,236</small><div class="bubble">☆</div><small>569</small><div class="bubble">↗</div><small>share</small></div><div class="caption"><div class="user">@ KENZO China</div><h2>${d.title}</h2><p>${d.lead}</p><button class="openBtn" data-a="openDetail">展开完整内容</button></div></div>`}function render(){document.querySelector('#app').className='app on '+S.world;document.querySelector('#content').innerHTML=(S.world==='xhs'?xHeader()+xPage():dHeader()+dPage());document.querySelector('#progress').textContent=`${String(S.chapter+1).padStart(2,'0')} / 07`;document.querySelector('#guideList').innerHTML=NAV.map((n,i)=>`<button class="gitem ${i===S.chapter?'on':''}" data-a="go" data-v="${i}"><small>${String(i+1).padStart(2,'0')}</small><b>${n}</b></button>`).join('');document.querySelector('#scroll').scrollTop=0}function showDetail(){let d=D();$('#detailTitle').textContent=d.title;$('#detailLead').textContent=d.lead;$('#detailBody').innerHTML=detail();$('#detail').classList.add('show')}document.addEventListener('click',ev=>{let b=ev.target.closest('[data-a]');if(!b)return;let a=b.dataset.a,v=b.dataset.v;if(a==='lang'){S.lang=v;$$('[data-a=lang]').forEach(x=>x.classList.toggle('on',x===b))}else if(a==='worldStep'){$('#langStep').classList.add('hide');$('#worldStep').classList.remove('hide')}else if(a==='backStep'){$('#worldStep').classList.add('hide');$('#langStep').classList.remove('hide')}else if(a==='world'){S.world=v;$$('[data-a=world]').forEach(x=>x.classList.toggle('on',x===b))}else if(a==='enter'){$('#entry').classList.add('hide');render()}else if(a==='reset'){$('#app').className='app';$('#entry').classList.remove('hide');$('#worldStep').classList.remove('hide');$('#langStep').classList.add('hide')}else if(a==='guide'){$('#guide').classList.add('show')}else if(a==='closeGuide'){$('#guide').classList.remove('show')}else if(a==='go'){S.chapter=+v;S.tab=0;$('#guide').classList.remove('show');$('#detail').classList.remove('show');render()}else if(a==='prev'){if(S.chapter>0){S.chapter--;S.tab=0;render()}}else if(a==='next'){if(S.chapter<6){S.chapter++;S.tab=0;render()}}else if(a==='openDetail'){showDetail()}else if(a==='closeDetail'){$('#detail').classList.remove('show')}else if(a==='tab'){S.tab=+v;if(S.world==='dy'&&$('#detail').classList.contains('show')){$('#detailBody').innerHTML=detail()}else render()}else if(a==='toggleWorld'){S.world=S.world==='xhs'?'dy':'xhs';$('#guide').classList.remove('show');S.tab=0;render()}else if(a==='toggleLang'){S.lang=S.lang==='cn'?'tw':'cn';render()}else if(a==='case'||a==='ref'){showDetail()}});</script></body></html>
